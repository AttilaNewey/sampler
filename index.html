<style>
  .grid-container {
    display: grid;
    border: black;
    background: gray;
    width: 100%;
  }
  
  .grid-item {
    background: gray;
    width: 33%;
  }
</style>
<body>
  <div class="grid-container">
    <div class="grid-item">1</div>
    <div class="grid-item">2</div>
    <div class="grid-item">3</div>
    <div class="grid-item">4</div>
    <div class="grid-item">5</div>
    <div class="grid-item">6</div>
  </div>
  </body>

<script src="https://cdn.jsdelivr.net/gh/netizenorg/netnet-standard-library@1.0.1/build/nn.min.js"></script>
<script>

  let base = 'https://storage.googleapis.com/cdn.patatap.com/A/'
  
  
  nn.get('body')
    .content ('hello world')
    // .css ('background', 'turquoise')
    // .css('margin', '45%') 
    .css ('font-family', 'futura')
    .css ('font-size', '40px')
  
  let clay = nn.create('audio')
    .addTo('body')
    .set('preload', 'auto')
    // .set('controls', true)
    .set('src', base + 'clay.mp3')
  
  let moon = nn.create('audio')
    .addTo('body')
    // .set('controls', true)
    .set('preload', 'auto')
    .set('src', base + 'moon.mp3')
  
  function play (q) {
    if (q.key === 'q') {
      clay.currentTime = 0
    clay.play()
    }
    if (q.key === 'w') {
      moon.currentTime = 0
    moon.play()
    }
  }
  
  
  nn.on('keydown', play)
  
</script>
