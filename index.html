</body>

<script src="https://cdn.jsdelivr.net/gh/netizenorg/netnet-standard-library@1.0.1/build/nn.min.js"></script>
<script>

  let base = 'audio/'
  
  
  nn.get('body')
    .content ('squeeze me')
    // .css ('background', 'turquoise')
    // .css('margin', '45%') 
    .css ('font-family', 'futura')
    .css ('font-size', '40px')
  
  let c = nn.create('audio')
    .addTo('body')
    .set('preload', 'auto')
    // .set('controls', true)
    .set('src', base + 'c.mp3')
  
    let d = nn.create('audio')
    .addTo('body')
    // .set('controls', true)
    .set('preload', 'auto')
    .set('src', base + 'd.mp3')
  
    let e = nn.create('audio')
    .addTo('body')
    // .set('controls', true)
    .set('preload', 'auto')
    .set('src', base + 'e.mp3')

    let f = nn.create('audio')
    .addTo('body')
    // .set('controls', true)
    .set('preload', 'auto')
    .set('src', base + 'f.mp3')
    
    let g = nn.create('audio')
    .addTo('body')
    // .set('controls', true)
    .set('preload', 'auto')
    .set('src', base + 'g.mp3')
  
    let a = nn.create('audio')
    .addTo('body')
    // .set('controls', true)
    .set('preload', 'auto')
    .set('src', base + 'a.mp3')
    
    let b = nn.create('audio')
    .addTo('body')
    // .set('controls', true)
    .set('preload', 'auto')
    .set('src', base + 'b.mp3')
    
let last = nn.width

function play () {
  let now = nn.width

  if ((last >= 400 && now < 400) || (last < 400 && now >= 400)) {
    // || means 'or'
    c.currentTime = 0
    c.play()
  }
  if ((last >= 500 && now < 500) || (last < 500 && now >= 500)) {
    d.currentTime = 0
    d.play()
  }
  if ((last >= 600 && now < 600) || (last < 600 && now >= 600)) {
    e.currentTime = 0
    e.play()
  }
  if ((last >= 700 && now < 700) || (last < 700 && now >= 700)) {
    f.currentTime = 0
    f.play()
  }
    if ((last >= 800 && now < 800) || (last < 800 && now >= 800)) {
    g.currentTime = 0
    g.play()
  }
    if ((last >= 900 && now < 900) || (last < 900 && now >= 900)) {
    a.currentTime = 0
    a.play()
  }
    if ((last >= 1000 && now < 1000) || (last < 1000 && now >= 1000)) {
    b.currentTime = 0
    b.play()
  }
  
  last = now
}
  
  
  nn.on('resize', play)
  
</script>
